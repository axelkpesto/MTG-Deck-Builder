[pytest]
testpaths = backend/tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -ra --strict-markers --tb=short
markers =
    slow: tests that take a long time to run
    integration: tests that hit real disk / external services
    requires_torch: tests that need a working PyTorch install
    requires_flask: tests that boot the Flask app
    requires_data: tests that need the on-disk vector database / model artifacts
filterwarnings =
    ignore::DeprecationWarning
    ignore::UserWarning
