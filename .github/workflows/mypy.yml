name: Mypy

permissions:
  contents: read

on:
  push:
    paths:
      - "**/*.py"
      - ".github/workflows/mypy.yml"
  pull_request:
    paths:
      - "**/*.py"
      - ".github/workflows/mypy.yml"

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install mypy -r backend/requirements.txt

      - name: Run mypy
        run: |
          mypy backend/ \
            --ignore-missing-imports \
            --exclude 'venv|dataset_builders|legacy'
