name: Tests

on:
  push:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]

    env:
      # Dummy test values, NOT secrets. Safe to commit because they're only
      # used during pytest and have no production meaning.
      API_KEY_PEPPER: ci-test-pepper-value-not-secret
      REDIS_URL: memory://
      AUTHENTICATE: "0"
      FLASK_DEBUG: "0"
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest -r backend/requirements.txt

      - name: Verify pytest collection
        run: pytest --collect-only -q

      - name: Run test suite
        run: pytest -ra --tb=short
